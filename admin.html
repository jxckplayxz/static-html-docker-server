<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Rock Island FC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #FFD700;
            --bg: #0a0a0a;
            --card: #141414;
            --border: rgba(255,255,255,0.08);
            --text: #fff;
            --dim: #999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card img { width: 80px; margin-bottom: 20px; }
        .login-card h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; margin-bottom: 8px; }
        .login-card p { color: var(--dim); font-size: 0.9rem; margin-bottom: 28px; }
        .login-card input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
        }
        .login-card input:focus { border-color: var(--primary); }
        .login-card button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
        }
        .login-card button:hover { background: #ffe44d; }
        .error { color: #ff5555; font-size: 0.85rem; margin-top: 12px; display: none; }

        .dashboard { display: none; max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .dash-header h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; }
        .dash-header .actions { display: flex; gap: 12px; }
        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid var(--border); }
        .btn-danger { background: #ff3333; color: #fff; }
        .btn:hover { opacity: 0.9; }

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 32px;
        }
        .form-card h2 { font-size: 1.15rem; margin-bottom: 20px; font-family: 'Outfit', sans-serif; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 0.8rem; color: var(--dim); font-weight: 500; }
        input, select, textarea {
            padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); }
        .logo-preview {
            width: 64px; height: 64px;
            object-fit: contain;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
        .radio-row { display: flex; gap: 20px; margin-top: 4px; flex-wrap: wrap; }
        .radio-row label { display: flex; align-items: center; gap: 6px; color: #fff; cursor: pointer; }

        .score-row {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 8px;
        }
        .score-row.show { display: grid; }

        .matches-list { display: flex; flex-direction: column; gap: 16px; }
        .match-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .match-item .info { flex: 1; min-width: 200px; }
        .match-item .teams { font-weight: 600; margin-bottom: 4px; }
        .match-item .meta { font-size: 0.85rem; color: var(--dim); }
        .match-item .logos { display: flex; gap: 10px; align-items: center; }
        .match-item .logos img { width: 40px; height: 40px; object-fit: contain; }
        .badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            margin-left: 8px;
        }
        .badge-upcoming { background: rgba(255,215,0,0.15); color: #FFD700; }
        .badge-past { background: rgba(100,100,100,0.3); color: #aaa; }
        .empty { text-align: center; color: var(--dim); padding: 40px; }
        .hidden { display: none !important; }
        .section-label {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            margin: 28px 0 12px;
            color: var(--dim);
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-wrap" id="loginScreen">
        <div class="login-card">
            <img src="logo.jpg" alt="RIFC">
            <h1>Admin Login</h1>
            <p>Rock Island FC • Match Manager</p>
            <input type="text" id="username" placeholder="Username" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button onclick="tryLogin()">Sign In</button>
            <p class="error" id="loginError">Wrong username or password</p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <div class="dash-header">
            <h1>⚽ Match Manager</h1>
            <div class="actions">
                <a href="index.html" class="btn btn-outline" target="_blank">View Site</a>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- ADD / EDIT FORM -->
        <div class="form-card">
            <h2 id="formTitle">Add New Match</h2>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Match Type</label>
                    <div class="radio-row">
                        <label><input type="radio" name="status" value="upcoming" checked onchange="toggleScore()"> Upcoming</label>
                        <label><input type="radio" name="status" value="past" onchange="toggleScore()"> Past / Last Match</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="matchDate">
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="matchTime">
                </div>
                <div class="form-group full">
                    <label>Location / Venue</label>
                    <input type="text" id="matchLocation" placeholder="e.g. Green Valley Sports Complex – Field 6">
                </div>
                <div class="form-group">
                    <label>Opponent Team Name</label>
                    <input type="text" id="opponentName" placeholder="e.g. Muscatine SC">
                </div>
                <div class="form-group">
                    <label>Home or Away?</label>
                    <div class="radio-row">
                        <label><input type="radio" name="side" value="home" checked> Home (RIFC is Home)</label>
                        <label><input type="radio" name="side" value="away"> Away (RIFC is Away)</label>
                    </div>
                </div>
                <div class="form-group full">
                    <label>Opponent Logo (upload image)</label>
                    <input type="file" id="opponentLogo" accept="image/*" onchange="previewLogo(event)">
                    <img id="logoPreview" class="logo-preview hidden" alt="Preview">
                </div>

                <!-- Score fields (only for past matches) -->
                <div class="form-group full score-row" id="scoreRow">
                    <div class="form-group">
                        <label>RIFC Score</label>
                        <input type="number" id="scoreUs" min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Opponent Score</label>
                        <input type="number" id="scoreThem" min="0" placeholder="0">
                    </div>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 12px;">
                <button class="btn btn-primary" onclick="saveMatch()">
                    <i data-lucide="plus" style="width:16px"></i> <span id="saveBtnText">Add Match</span>
                </button>
                <button class="btn btn-outline hidden" id="cancelEdit" onclick="cancelEdit()">Cancel</button>
            </div>
        </div>

        <!-- CURRENT MATCHES -->
        <div class="section-label">Upcoming Matches</div>
        <div class="matches-list" id="upcomingList">
            <div class="empty">No upcoming matches.</div>
        </div>

        <div class="section-label">Last / Past Matches</div>
        <div class="matches-list" id="pastList">
            <div class="empty">No past matches yet.</div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'rifc.admin';
        const ADMIN_PASS = 'alimasi123';

        function tryLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem('rifc_admin', '1');
                showDashboard();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('rifc_admin');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            renderMatches();
            lucide.createIcons();
        }

        if (sessionStorage.getItem('rifc_admin') === '1') {
            showDashboard();
        }

        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') tryLogin();
        });

        let editingId = null;
        let pendingLogoData = null;

        function getMatches() {
            try {
                return JSON.parse(localStorage.getItem('rifc_matches') || '[]');
            } catch {
                return [];
            }
        }

        function saveMatches(matches) {
            localStorage.setItem('rifc_matches', JSON.stringify(matches));
        }

        function toggleScore() {
            const isPast = document.querySelector('input[name="status"]:checked').value === 'past';
            document.getElementById('scoreRow').classList.toggle('show', isPast);
        }

        function previewLogo(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                pendingLogoData = ev.target.result;
                const img = document.getElementById('logoPreview');
                img.src = pendingLogoData;
                img.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function saveMatch() {
            const date = document.getElementById('matchDate').value;
            const time = document.getElementById('matchTime').value;
            const location = document.getElementById('matchLocation').value.trim();
            const opponent = document.getElementById('opponentName').value.trim();
            const side = document.querySelector('input[name="side"]:checked').value;
            const status = document.querySelector('input[name="status"]:checked').value;
            const scoreUs = document.getElementById('scoreUs').value;
            const scoreThem = document.getElementById('scoreThem').value;

            if (!date || !time || !location || !opponent) {
                alert('Please fill in Date, Time, Location and Opponent name.');
                return;
            }

            if (status === 'past' && (scoreUs === '' || scoreThem === '')) {
                alert('Please enter both scores for a past match.');
                return;
            }

            const matches = getMatches();
            const match = {
                id: editingId || Date.now().toString(),
                date,
                time,
                location,
                opponent,
                side,
                status,
                scoreUs: status === 'past' ? parseInt(scoreUs) : null,
                scoreThem: status === 'past' ? parseInt(scoreThem) : null,
                logo: pendingLogoData || (editingId ? matches.find(m => m.id === editingId)?.logo : null)
            };

            if (editingId) {
                const idx = matches.findIndex(m => m.id === editingId);
                if (idx !== -1) matches[idx] = match;
            } else {
                matches.push(match);
            }

            matches.sort((a, b) => {
                const da = new Date(a.date + 'T' + a.time);
                const db = new Date(b.date + 'T' + b.time);
                return da - db;
            });

            saveMatches(matches);
            resetForm();
            renderMatches();
        }

        function editMatch(id) {
            const match = getMatches().find(m => m.id === id);
            if (!match) return;
            editingId = id;
            document.getElementById('matchDate').value = match.date;
            document.getElementById('matchTime').value = match.time;
            document.getElementById('matchLocation').value = match.location;
            document.getElementById('opponentName').value = match.opponent;
            document.querySelector(`input[name="side"][value="${match.side}"]`).checked = true;
            document.querySelector(`input[name="status"][value="${match.status || 'upcoming'}"]`).checked = true;
            toggleScore();
            if (match.status === 'past') {
                document.getElementById('scoreUs').value = match.scoreUs ?? '';
                document.getElementById('scoreThem').value = match.scoreThem ?? '';
            }
            pendingLogoData = match.logo || null;
            const preview = document.getElementById('logoPreview');
            if (match.logo) {
                preview.src = match.logo;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
            document.getElementById('formTitle').textContent = 'Edit Match';
            document.getElementById('saveBtnText').textContent = 'Update Match';
            document.getElementById('cancelEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteMatch(id) {
            if (!confirm('Delete this match?')) return;
            const matches = getMatches().filter(m => m.id !== id);
            saveMatches(matches);
            renderMatches();
        }

        function cancelEdit() {
            resetForm();
        }

        function resetForm() {
            editingId = null;
            pendingLogoData = null;
            document.getElementById('matchDate').value = '';
            document.getElementById('matchTime').value = '';
            document.getElementById('matchLocation').value = '';
            document.getElementById('opponentName').value = '';
            document.querySelector('input[name="side"][value="home"]').checked = true;
            document.querySelector('input[name="status"][value="upcoming"]').checked = true;
            document.getElementById('scoreUs').value = '';
            document.getElementById('scoreThem').value = '';
            document.getElementById('opponentLogo').value = '';
            document.getElementById('logoPreview').classList.add('hidden');
            document.getElementById('scoreRow').classList.remove('show');
            document.getElementById('formTitle').textContent = 'Add New Match';
            document.getElementById('saveBtnText').textContent = 'Add Match';
            document.getElementById('cancelEdit').classList.add('hidden');
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function formatTime(timeStr) {
            const [h, m] = timeStr.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const h12 = hour % 12 || 12;
            return h12 + ':' + m + ' ' + ampm + ' CDT';
        }

        function renderList(matches, containerId) {
            const list = document.getElementById(containerId);
            if (matches.length === 0) {
                list.innerHTML = '<div class="empty">None yet.</div>';
                return;
            }
            list.innerHTML = matches.map(m => {
                const scoreText = m.status === 'past'
                    ? ` <strong style="color:#FFD700">${m.scoreUs} – ${m.scoreThem}</strong>`
                    : '';
                const badge = m.status === 'past'
                    ? '<span class="badge badge-past">PAST</span>'
                    : '<span class="badge badge-upcoming">UPCOMING</span>';
                return `
                <div class="match-item">
                    <div class="logos">
                        ${m.side === 'home' 
                            ? `<img src="logo.jpg" alt="RIFC"><span style="color:#FFD700;font-weight:700">vs</span><img src="\( {m.logo || ''}" alt=" \){m.opponent}" onerror="this.style.opacity=0.3">`
                            : `<img src="\( {m.logo || ''}" alt=" \){m.opponent}" onerror="this.style.opacity=0.3"><span style="color:#FFD700;font-weight:700">vs</span><img src="logo.jpg" alt="RIFC">`
                        }
                    </div>
                    <div class="info">
                        <div class="teams">
                            ${m.side === 'home' 
                                ? `Rock Island FC vs ${m.opponent}` 
                                : `${m.opponent} vs Rock Island FC`}
                            \( {badge} \){scoreText}
                        </div>
                        <div class="meta">${formatDate(m.date)} • ${formatTime(m.time)} • ${m.location}</div>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-outline" onclick="editMatch('${m.id}')" style="padding:8px 12px;">Edit</button>
                        <button class="btn btn-danger" onclick="deleteMatch('${m.id}')" style="padding:8px 12px;">Delete</button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderMatches() {
            const all = getMatches();
            const upcoming = all.filter(m => m.status !== 'past');
            const past = all.filter(m => m.status === 'past').reverse();
            renderList(upcoming, 'upcomingList');
            renderList(past, 'pastList');
        }
    </script>
</body>
                  </html>
