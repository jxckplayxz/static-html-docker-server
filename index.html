<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Island FC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--red:#E31C23;--red-dark:#A81419;--red-deep:#7A0F13;--black:#0A0A0A;--card:#121212;--elevated:#1A1A1A;--text:#fff;--muted:#999;--border:rgba(255,255,255,.08);--font:'Outfit',sans-serif;--body:'Inter',sans-serif}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{font-family:var(--body);background:var(--black);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

.nav{position:fixed;top:0;left:0;right:0;z-index:1000}
.nav-top{background:var(--red);padding:8px 0;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-align:center;color:#fff}
.nav-main{display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:transparent;transition:all .3s}
.nav.scrolled .nav-main{background:rgba(10,10,10,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 48px}

.nav-logo,.footer-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.nav-logo img{height:48px;width:auto;object-fit:contain}
.nav-logo span,.footer-logo span{font-family:var(--font);font-weight:800;font-size:1.15rem;text-transform:uppercase}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a,.footer-links a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.9rem;font-weight:600;text-transform:uppercase;transition:color .2s}
.nav-links a:hover,.footer-links a:hover{color:var(--red)}


.hero{min-height:100vh;position:relative;display:flex;align-items:flex-end;padding:0 48px 80px;overflow:hidden;max-width:none;margin:0}
.hero-bg{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(10,10,10,.5) 50%,rgba(10,10,10,.98) 100%),linear-gradient(90deg,rgba(227,28,35,.4) 0%,transparent 55%),radial-gradient(ellipse at 70% 30%,rgba(227,28,35,.12) 0%,transparent 50%);z-index:1}
.hero-bg:before{content:'';position:absolute;inset:0;background:url('/logo.png') center 40%/42% no-repeat;opacity:.07;filter:grayscale(1)}
